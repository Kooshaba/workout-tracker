<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Workout Tracker</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f3f4f6;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        color: #1f2937;
      }
      p {
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title">You're Offline</h1>
      <p id="message">Please check your internet connection and try again.</p>
    </div>
    <script>
      const language = localStorage.getItem("preferredLanguage");
      if (language === "ja") {
        document.documentElement.lang = "ja";
        document.title = "オフライン - ワークアウトトラッカー";
        document.getElementById("title").textContent = "オフラインです";
        document.getElementById("message").textContent =
          "インターネット接続を確認して、もう一度お試しください。";
      }
    </script>
  </body>
</html>
